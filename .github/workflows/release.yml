name: "Release"

# Tagging vX.Y.Z on GitHub publishes release with a prebuilt static binary,
on:
  push:
    tags:
      - "v*"

permissions:
  contents: "write"

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      - name: "Build static binary"
        env:
          CC_x86_64_unknown_linux_musl: "musl-gcc"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: "musl-gcc"
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools # provides musl-gcc for libgit2-sys
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl

      - name: "Publish release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf slug-x86_64-unknown-linux-musl.tar.gz \
            -C target/x86_64-unknown-linux-musl/release slug
          gh release create "$GITHUB_REF_NAME" \
            --title "Slug $GITHUB_REF_NAME" \
            --generate-notes \
            slug-x86_64-unknown-linux-musl.tar.gz
